services:
  # Define a embedding provider.
  dropai_pinecone.service_embedding_provider:
    class: Drupal\dropai_pinecone\Service\PineconeEmbeddingProvider
    arguments: ['@config.factory', '@logger.factory']
    tags:
      - { name: dropai_service_embedding_provider }

  # Define a Event Subscriber.
  dropai_pinecone.service_embedding_event_subscriber:
    class: Drupal\dropai_pinecone\EventSubscriber\PineconeEmbeddingEventSubscriber
    tags:
      - { name: event_subscriber }
    arguments: ['@dropai_pinecone.service_embedding_provider', '@logger.factory']
